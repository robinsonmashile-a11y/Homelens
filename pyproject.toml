[project]
name = "homelens"
version = "0.1.0"
description = "Real-time property intelligence platform for Cape Town"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "supabase>=2.5.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
]

[project.scripts]
scrape = "scripts.scrape:main"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
