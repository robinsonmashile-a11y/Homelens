name: Homelens scrape

on:
  schedule:
    - cron: '0 2 * * *'   # daily 04:00 SAST
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated scrapers to run (blank = all)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    name: scrape (${{ matrix.scraper }}${{ matrix.cities && format(' / {0}', matrix.cities) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scraper: pamgolding, cities: '' }
          - { scraper: sothebys, cities: '' }
          - { scraper: tyson, cities: '' }
          - { scraper: seeff, cities: '' }
          - { scraper: quay1, cities: '' }
          - { scraper: chaseveritt, cities: '' }
          - { scraper: greeff, cities: '' }
          - { scraper: jawitz, cities: '' }
          - { scraper: engelvolkers, cities: '' }
          - { scraper: century21, cities: '' }
          - { scraper: harcourts, cities: '' }
          - { scraper: lionlead, cities: '' }
          - { scraper: abc_international, cities: '' }
          - { scraper: justproperty, cities: '' }
          - { scraper: dgproperties, cities: '' }
          - { scraper: duarte, cities: '' }
          - { scraper: exprealty, cities: '' }
          - { scraper: rawson, cities: cape-town }
          - { scraper: rawson, cities: johannesburg }
          - { scraper: remax, cities: cape-town }
          - { scraper: remax, cities: johannesburg }
    defaults:
      run:
        working-directory: homelens-scraper
    steps:
      - name: Skip if not selected
        id: gate
        working-directory: .
        run: |
          ONLY="${{ github.event.inputs.only }}"
          if [ -z "$ONLY" ] || echo ",$ONLY," | grep -q ",${{ matrix.scraper }},"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: homelens-scraper/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Check secrets (lengths only)
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "SUPABASE_URL length: ${#SUPABASE_URL} (expected 40)"
          echo "SUPABASE_KEY length: ${#SUPABASE_KEY} (expected 219)"
          echo "URL starts with https://: $([[ $SUPABASE_URL == https://* ]] && echo yes || echo NO)"
          echo "KEY has whitespace: $([[ $SUPABASE_KEY =~ [[:space:]] ]] && echo YES || echo no)"

      - name: Run ${{ matrix.scraper }}
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          HOMELENS_CITIES: ${{ matrix.cities }}
        run: python scripts/run_all_scrapers.py --only ${{ matrix.scraper }}
